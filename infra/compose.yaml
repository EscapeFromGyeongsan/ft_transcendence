name: cyber-board-cafe

# Local development. `db` is the development PostgreSQL (`npm run db:up`).
# `node` (profile `tools`) runs the npm commands in a container so the host
# needs no Node.js; the Makefile targets call it through infra/dev.sh.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 15

  node:
    # Node.js 24 with the browsers for the locked @playwright/test version.
    # Keep the tag equal to @playwright/test in package-lock.json.
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: [tools]
    working_dir: /app
    init: true
    volumes:
      - .:/app
      # Linux packages (argon2 is native) stay out of the host's node_modules.
      - node_modules:/app/node_modules
    environment:
      # The container reaches the database as `db`; .env keeps the 127.0.0.1
      # URLs for npm on the host. Values set here win over .env.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/cafe_test
      # Listen on every container interface; the ports below publish them on
      # the host's 127.0.0.1 only (with `run --service-ports`).
      API_HOST: 0.0.0.0
      DEV_HOST: 0.0.0.0
      HOME: /tmp/home
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    ports:
      - "127.0.0.1:${DEV_WEB_PORT:-5173}:5173"
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  node_modules:
